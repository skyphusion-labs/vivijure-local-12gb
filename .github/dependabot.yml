version: 2

# skyphusion-labs Dependabot standard -- see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Validated CUDA recipe pins -- bump only after benchmark-gated manual testing.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "diffusers"
      - dependency-name: "transformers"
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "av"
      # imageio 2.38.1 requires Python >=3.11. deploy/runtime.Dockerfile is
      # nvidia/cuda:12.4.1-runtime-ubuntu22.04, which ships Python 3.10, so
      # pip hides that release and the smoke build fails.
      # 2.38.x is not a pip version requirement, so Dependabot rejected the
      # file (#/updates/1/ignore/5/versions). ==2.38.* is that series.
      - dependency-name: "imageio"
        versions: ["==2.38.*"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
